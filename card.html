<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meekael Mandviya - Digital Business Card</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 40%),
        radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.08), transparent 40%),
        #000;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(92vw, 430px);
      padding: 32px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      background: rgba(15,15,15,0.88);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      text-align: center;
    }

    .card-logo {
      width: 95px;
      height: auto;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    h2 {
      margin: 8px 0 18px;
      font-size: 1rem;
      color: #93c5fd;
      font-weight: 600;
    }

    p {
      color: #d1d5db;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    a {
      display: block;
      text-decoration: none;
      color: #fff;
      background: #2563eb;
      padding: 13px 18px;
      border-radius: 12px;
      margin: 12px 0;
      font-weight: 700;
    }

    a.secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.18);
    }

    .small {
      margin-top: 22px;
      font-size: 0.85rem;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <main class="card">

    <img src="Logo.png" alt="Mandviya Systems Logo" class="card-logo">

    <h1>Meekael Mandviya</h1>
    <h2>Mandviya Systems</h2>

    <p>
      Web Development & Cloud Migration<br>
      Helping businesses build websites and execute cloud migrations using structured, practical solutions.
    </p>

    <a href="https://calendar.app.google/hJGPdHDZ1YkxG2jFA" target="_blank">
      Book a Discovery Call
    </a>

    <a class="secondary" href="https://mandviyasystems.github.io/MeekaelMandviya.com/" target="_blank">
      Visit Website
    </a>

    <a class="secondary" href="mailto:mandviyasystems@gmail.com">
      Email Me
    </a>

    <a class="secondary" href="meekael-mandviya.vcf">
      Save Contact
    </a>

    <a class="secondary" href="https://www.linkedin.com/in/meekael-mandviya/" target="_blank">
      LinkedIn
    </a>

    <a class="secondary" href="https://www.instagram.com/meekael_mandviya" target="_blank">
      Instagram
    </a>

    <div class="small">Mandviya Systems</div>

  </main>

</body>
</html>
